name: c

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        cc: [gcc, clang]
        exclude:
          - os: macos-latest
            cc: gcc
    steps:
      - uses: actions/checkout@v4
      - name: PQID C build and test
        env:
          CC: ${{ matrix.cc }}
        run: |
          cd pqid/c
          make clean
          make all
          ./test_pqid
      - name: PQHash C build and test
        env:
          CC: ${{ matrix.cc }}
        run: |
          cd pqhash/c
          make clean
          make test
      - name: Build conformance runner
        env:
          CC: ${{ matrix.cc }}
        run: |
          cd tools/conformance/c
          make
      - name: Run conformance vectors against C runner
        run: |
          for f in pqid/conformance/vectors/*.json pqhash/conformance/vectors/*.json; do
            tools/conformance/c/conformance_runner "$f"
          done
      - name: PQID fuzz smoke (60s)
        env:
          CC: ${{ matrix.cc }}
        run: |
          cd pqid/c
          make fuzz_decode
          timeout 60 ./fuzz_decode 5000000 || ec=$?
          if [ "${ec:-0}" != "0" ] && [ "${ec:-0}" != "124" ]; then
            exit "$ec"
          fi
