name: c

on:
  workflow_dispatch:   # manual only — no auto-build on push/PR (cost control)

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        cc: [gcc, clang]
        exclude:
          - os: macos-latest
            cc: gcc
    steps:
      - uses: actions/checkout@v4
      - name: TesseraID C build and test
        env:
          CC: ${{ matrix.cc }}
        run: |
          cd tessera-id/c
          make clean
          make all
          ./test_tessera_id
      - name: TesseraHash C build and test
        env:
          CC: ${{ matrix.cc }}
        run: |
          cd tessera-hash/c
          make clean
          make test
      - name: Build conformance runner
        env:
          CC: ${{ matrix.cc }}
        run: |
          cd tools/conformance/c
          make
      - name: Run conformance vectors against C runner
        run: |
          for f in tessera-id/conformance/vectors/*.json tessera-hash/conformance/vectors/*.json; do
            tools/conformance/c/conformance_runner "$f"
          done
      - name: TesseraID fuzz smoke (60s)
        env:
          CC: ${{ matrix.cc }}
        run: |
          cd tessera-id/c
          make fuzz_decode
          timeout 60 ./fuzz_decode 5000000 || ec=$?
          if [ "${ec:-0}" != "0" ] && [ "${ec:-0}" != "124" ]; then
            exit "$ec"
          fi
