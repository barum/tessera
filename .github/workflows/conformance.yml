name: conformance

# Automatic gate restored 2026-06-10 (TESS-00006 / TP-013): runs on every PR and
# every push to main, plus manual dispatch. This is the branch-protection gate;
# the other 10 workflows stay manual-only (cost control).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cross-language conformance gate: builds every implementation on a single
# runner and runs the harness end-to-end against vectors from tessera-id/,
# tessera-hash/, and tessera-seal/. The blocking gate is the alpha step below
# (python + c + go + rust, which have TesseraSeal runners); the full-8 step is
# informational (continue-on-error) because cpp/typescript/java/cpython have no
# TesseraSeal runner yet and run TesseraID + TesseraHash only. The per-language
# workflows (python.yml, c.yml, …) cover per-OS and per-toolchain variants
# independently.
jobs:
  cross-language:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tessera-seal/python/requirements.txt
      - name: Install Python deps (TesseraSeal requires kyber-py + cryptography)
        run: |
          python3 -m pip install --upgrade pip setuptools
          pip install -r tessera-seal/python/requirements.txt

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
          cache-dependency-path: "**/go.sum"

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: "**/package-lock.json"

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "24"

      # Ubuntu 24.04 apt ships OpenSSL 3.0.x, which has NO ML-KEM provider — the
      # C seal reference needs EVP_PKEY "ML-KEM-1024" (OpenSSL 3.5+). No apt
      # package or maintained PPA ships 3.5+, and a container image would lose
      # the 6 language toolchains this job needs from the runner image, so we
      # build 3.5.7 from source once (configure no-docs no-tests, ~3-4 min) and
      # cache the install keyed on the version (warm restores in seconds).
      - name: Cache OpenSSL 3.5 (TP-007)
        id: cache-openssl
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/openssl-3.5
          key: openssl-3.5.7-${{ runner.os }}-${{ runner.arch }}
      - name: Build OpenSSL 3.5.7 from source (cache miss only)
        if: steps.cache-openssl.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSLO https://github.com/openssl/openssl/releases/download/openssl-3.5.7/openssl-3.5.7.tar.gz
          echo "a8c0d28a529ca480f9f36cf5792e2cd21984552a3c8e4aa11a24aa31aeac98e8  openssl-3.5.7.tar.gz" | sha256sum -c -
          tar xzf openssl-3.5.7.tar.gz
          cd openssl-3.5.7
          ./Configure --prefix="$HOME/openssl-3.5" --libdir=lib no-docs no-tests
          make -s -j"$(nproc)"
          make -s install_sw
      - name: Point C builds at OpenSSL 3.5 (Makefiles honor OPENSSL_PREFIX)
        run: |
          echo "OPENSSL_PREFIX=$HOME/openssl-3.5" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$HOME/openssl-3.5/lib" >> "$GITHUB_ENV"
      - name: Assert OpenSSL >= 3.5 (fail fast — ML-KEM requires 3.5+)
        run: |
          set -euo pipefail
          "$HOME/openssl-3.5/bin/openssl" version
          v="$("$HOME/openssl-3.5/bin/openssl" version | awk '{print $2}')"
          case "$v" in
            3.[5-9]*|3.[1-9][0-9]*|[4-9].*) echo "OpenSSL $v OK (>= 3.5)" ;;
            *) echo "::error::OpenSSL $v < 3.5 — no ML-KEM provider; C seal leg would fail all positive decrypts"; exit 1 ;;
          esac

      - name: TesseraSeal alpha conformance (Python + C + Go + Rust)
        run: TESSERA_CONFORMANCE_SKIP="cpp typescript java cpython" bash tools/conformance/run.sh

      - name: TesseraSeal decrypt-path timing-histogram gate (TSEAL-00048, profile ci)
        run: |
          set -euo pipefail
          python3 tools/scripts/timing-histogram.py \
            --profile ci \
            --json-out timing-histogram-report.json
          python3 -c "
          import json, sys
          r = json.load(open('timing-histogram-report.json'))
          assert r.get('schema_version') == 1
          print(f\"timing-histogram CI gate: verdict={r['verdict']} gate_passed={r['gate_passed']} "
                f\"primary_metric_ns={r['primary_metric_ns']:.1f}\")
          sys.exit(0 if r['gate_passed'] else r['exit_code'])
          "

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: timing-histogram-report
          path: timing-histogram-report.json

      - name: Full cross-language conformance (all 8 ports)
        run: bash tools/conformance/run.sh
        continue-on-error: true
