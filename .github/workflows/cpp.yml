name: cpp

on:
  workflow_dispatch:   # manual only — no auto-build on push/PR (cost control)

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        cxx: [g++, clang++]
        exclude:
          - os: macos-latest
            cxx: g++
    steps:
      - uses: actions/checkout@v4
      - name: TesseraID C++ build and test
        env:
          CXX: ${{ matrix.cxx }}
        run: |
          cd tessera-id/cpp
          make clean
          make all
          ./test_tessera_id
      - name: TesseraHash C++ build and test
        env:
          CXX: ${{ matrix.cxx }}
        run: |
          cd tessera-hash/cpp
          make clean
          make test
      - name: Build conformance runner
        env:
          CXX: ${{ matrix.cxx }}
        run: |
          cd tools/conformance/cpp
          make
      - name: Run conformance vectors against C++ runner
        run: |
          for f in tessera-id/conformance/vectors/*.json tessera-hash/conformance/vectors/*.json; do
            tools/conformance/cpp/conformance_runner "$f"
          done
      - name: TesseraID fuzz smoke (60s)
        env:
          CXX: ${{ matrix.cxx }}
        run: |
          cd tessera-id/cpp
          make fuzz_decode
          timeout 60 ./fuzz_decode 5000000 || ec=$?
          if [ "${ec:-0}" != "0" ] && [ "${ec:-0}" != "124" ]; then
            exit "$ec"
          fi
