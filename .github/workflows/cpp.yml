name: cpp

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        cxx: [g++, clang++]
        exclude:
          - os: macos-latest
            cxx: g++
    steps:
      - uses: actions/checkout@v4
      - name: PQID C++ build and test
        env:
          CXX: ${{ matrix.cxx }}
        run: |
          cd pqid/cpp
          make clean
          make all
          ./test_pqid
      - name: PQHash C++ build and test
        env:
          CXX: ${{ matrix.cxx }}
        run: |
          cd pqhash/cpp
          make clean
          make test
      - name: Build conformance runner
        env:
          CXX: ${{ matrix.cxx }}
        run: |
          cd tools/conformance/cpp
          make
      - name: Run conformance vectors against C++ runner
        run: |
          for f in pqid/conformance/vectors/*.json pqhash/conformance/vectors/*.json; do
            tools/conformance/cpp/conformance_runner "$f"
          done
      - name: PQID fuzz smoke (60s)
        env:
          CXX: ${{ matrix.cxx }}
        run: |
          cd pqid/cpp
          make fuzz_decode
          timeout 60 ./fuzz_decode 5000000 || ec=$?
          if [ "${ec:-0}" != "0" ] && [ "${ec:-0}" != "124" ]; then
            exit "$ec"
          fi
