name: cpp

on:
  workflow_dispatch:   # manual only — no auto-build on push/PR (cost control)

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        cxx: [g++, clang++]
        exclude:
          - os: macos-latest
            cxx: g++
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: TesseraID C++ build and test
        env:
          CXX: ${{ matrix.cxx }}
        run: |
          cd tessera-id/cpp
          make clean
          make all
          ./test_tessera_id
      - name: TesseraHash C++ build and test
        env:
          CXX: ${{ matrix.cxx }}
        run: |
          cd tessera-hash/cpp
          make clean
          make test
      - name: Build conformance runner
        env:
          CXX: ${{ matrix.cxx }}
        run: |
          cd tools/conformance/cpp
          make
      - name: Run conformance vectors against C++ runner
        run: |
          for f in tessera-id/conformance/vectors/*.json tessera-hash/conformance/vectors/*.json; do
            tools/conformance/cpp/conformance_runner "$f"
          done
      # GNU `timeout` does not exist on macOS runners (exit 127). The harness
      # takes an iteration budget as argv[1], which bounds the runtime portably
      # (TP-009).
      - name: TesseraID fuzz smoke (5M iterations)
        env:
          CXX: ${{ matrix.cxx }}
        run: |
          cd tessera-id/cpp
          make fuzz_decode
          ./fuzz_decode 5000000
