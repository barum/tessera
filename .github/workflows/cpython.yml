name: cpython-extension

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install build deps
        run: python3 -m pip install --upgrade pip setuptools
      - name: Build extension
        working-directory: tessera-id/cpython
        run: python3 setup.py build_ext --inplace
      - name: Run extension tests
        working-directory: tessera-id/cpython
        run: python3 test_tessera_id_ext.py
      - name: Run conformance runner against all vectors
        run: |
          for f in tessera-id/conformance/vectors/*.json tessera-hash/conformance/vectors/*.json; do
            python3 tools/conformance/cpython/conformance_runner.py "$f"
          done
      - name: Fuzz smoke (60s)
        working-directory: tessera-id/cpython
        run: |
          timeout 60 python3 fuzz/fuzz_decode.py 1000000 || ec=$?
          if [ "${ec:-0}" != "0" ] && [ "${ec:-0}" != "124" ]; then
            exit "$ec"
          fi
