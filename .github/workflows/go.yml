name: go

on:
  workflow_dispatch:   # manual only — no auto-build on push/PR (cost control)

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # go.mod declares `go 1.26` in every module; older entries here were
        # silently auto-upgraded by GOTOOLCHAIN, making the matrix fiction
        # (TP-014). Test the version that actually executes.
        go: ["1.26"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: "**/go.sum"
      - name: TesseraID Go tests
        working-directory: tessera-id/go
        run: go test ./...
      - name: TesseraHash Go tests
        working-directory: tessera-hash/go
        run: go test ./...
      - name: Build and run conformance runner
        run: |
          cd tools/conformance/go
          go build -o conformance_runner .
          cd ../../..
          for f in tessera-id/conformance/vectors/*.json tessera-hash/conformance/vectors/*.json; do
            tools/conformance/go/conformance_runner "$f"
          done
      - name: TesseraID fuzz smoke (20s each)
        working-directory: tessera-id/go
        run: |
          go test -run='^$' -fuzz='^FuzzDecode$' -fuzztime=20s .
          go test -run='^$' -fuzz='^FuzzDecodeBase64URL$' -fuzztime=20s .
          go test -run='^$' -fuzz='^FuzzDecodeCrockford$' -fuzztime=20s .
