name: go

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ["1.22", "1.23"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: PQID Go tests
        working-directory: pqid/go
        run: go test ./...
      - name: PQHash Go tests
        working-directory: pqhash/go
        run: go test ./...
      - name: Build and run conformance runner
        run: |
          cd tools/conformance/go
          go build -o conformance_runner .
          cd ../../..
          for f in pqid/conformance/vectors/*.json pqhash/conformance/vectors/*.json; do
            tools/conformance/go/conformance_runner "$f"
          done
      - name: PQID fuzz smoke (20s each)
        working-directory: pqid/go
        run: |
          go test -run='^$' -fuzz='^FuzzDecode$' -fuzztime=20s .
          go test -run='^$' -fuzz='^FuzzDecodeBase64URL$' -fuzztime=20s .
          go test -run='^$' -fuzz='^FuzzDecodeCrockford$' -fuzztime=20s .
