name: java

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        java: ["17", "21"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Build and test
        working-directory: pqid/java
        run: |
          make build
          make test
      - name: Run conformance runner
        working-directory: pqid/java
        run: |
          for f in ../conformance/vectors/*.json; do
            java -cp build com.pqid.ConformanceRunner "$f"
          done
      - name: Fuzz smoke (60s)
        working-directory: pqid/java
        run: |
          timeout 60 java -cp build com.pqid.FuzzDecode 1000000 || ec=$?
          if [ "${ec:-0}" != "0" ] && [ "${ec:-0}" != "124" ]; then
            exit "$ec"
          fi
