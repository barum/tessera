name: latex

on:
  workflow_dispatch:   # manual only — no auto-build on push/PR (cost control)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended \
            texlive-fonts-extra texlive-bibtex-extra \
            texlive-science biber
      - name: Build whitepaper
        run: |
          cd tessera-id/latex
          make
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: tessera-id-whitepaper
          path: tessera-id/latex/main.pdf
