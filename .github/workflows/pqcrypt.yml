name: pqcrypt

on:
  push:
    branches: [main]
    paths:
      - 'pqcrypt/**'
      - 'common/c/hkdf_sha3.*'
      - 'common/c/random.*'
      - 'common/c/pqtk_header.h'
      - '.github/workflows/pqcrypt.yml'
  pull_request:
    branches: [main]
    paths:
      - 'pqcrypt/**'
      - 'common/c/hkdf_sha3.*'
      - 'common/c/random.*'
      - 'common/c/pqtk_header.h'
      - '.github/workflows/pqcrypt.yml'

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r pqcrypt/python/requirements.txt pytest
      - name: pqcrypt Python tests
        run: cd pqcrypt/python && python3 -m pytest test_pqcrypt.py -v
      - name: pqcrypt bench (smoke)
        run: cd pqcrypt/python && python3 bench.py | head -30

  c:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenSSL 3.5+ on Ubuntu
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Build common/c primitives
        run: cd common/c && make test
      - name: Build and run pqcrypt/c tests
        run: cd pqcrypt/c && make test
      - name: Build and run pqcrypt/cpp tests
        run: cd pqcrypt/cpp && make test

  go:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: pqcrypt Go tests
        run: cd pqcrypt/go && go test -count=1 -timeout 120s

  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: pqcrypt Rust tests
        run: cd pqcrypt/rust && cargo test --release --test integration

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install + test
        run: |
          cd pqcrypt/typescript
          npm install
          npx tsc
          node --test dist/test_pqcrypt.js

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "24"
      - name: pqcrypt Java tests
        run: cd pqcrypt/java && make test

  cpython-ext:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install OpenSSL 3.5+ on Ubuntu
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - run: pip install setuptools
      - name: Build CPython extension
        run: cd pqcrypt/cpython && python3 setup.py build_ext --inplace
      - name: Run extension tests
        run: cd pqcrypt/cpython && python3 test_pqcrypt_ext.py

  latex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX Live
        run: sudo apt-get update && sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-bibtex-extra texlive-latex-recommended
      - name: Build whitepaper
        run: cd pqcrypt/latex && make
      - uses: actions/upload-artifact@v4
        with:
          name: PQCrypt_Whitepaper
          path: pqcrypt/latex/PQCrypt_Whitepaper.pdf
