name: python

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run TesseraID Python tests
        run: |
          cd tessera-id/python
          python3 test_tessera_id.py
      - name: Run TesseraHash Python tests
        run: |
          cd tessera-hash/python
          python3 test_tessera_hash.py
      - name: Run Python conformance runner against all vectors
        run: |
          for f in tessera-id/conformance/vectors/*.json tessera-hash/conformance/vectors/*.json; do
            python3 tools/conformance/python/python_runner.py "$f"
          done
      - name: TesseraID fuzz smoke (60s)
        run: |
          cd tessera-id/python
          timeout 60 python3 fuzz/fuzz_decode.py 1000000 || ec=$?
          if [ "${ec:-0}" != "0" ] && [ "${ec:-0}" != "124" ]; then
            exit "$ec"
          fi
