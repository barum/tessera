name: release

# Draft-release automation (TESS-00014; first slice of TP-093). Manual
# dispatch only: re-runs the full conformance gate, builds all four
# whitepapers and every per-language distributable at version 1.3.1, checksums
# everything, and uploads a DRAFT GitHub release for maintainer review.
#
# NO REGISTRY PUBLISHING HAPPENS HERE. Every publish stanza below is
# deliberately commented out, gated on the name-clearance decision
# (docs/decisions/2026-06-10-name-clearance.md). The distribution posture —
# publish-ready, not published — is recorded in
# docs/decisions/2026-06-10-distribution-posture.md together with the exact
# command sequence to run when the gate opens.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to draft (e.g. v1.3.1)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Full conformance gate, mirroring conformance.yml (same SHA-pinned actions,
  # same OpenSSL 3.5 source build). The 4-language alpha step blocks the
  # release; the full-8 step stays informational until C++/TypeScript/Java/
  # CPython ext gain tessera-seal runners.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tessera-seal/python/requirements.txt
      - name: Install Python deps (TesseraSeal requires kyber-py + cryptography)
        run: |
          python3 -m pip install --upgrade pip setuptools
          pip install -r tessera-seal/python/requirements.txt

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
          cache-dependency-path: "**/go.sum"

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: "**/package-lock.json"

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "24"

      # Ubuntu 24.04 apt ships OpenSSL 3.0.x (no ML-KEM provider); the C seal
      # reference needs EVP_PKEY "ML-KEM-1024" (OpenSSL 3.5+). Same cached
      # source build as conformance.yml (TP-007).
      - name: Cache OpenSSL 3.5 (TP-007)
        id: cache-openssl
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/openssl-3.5
          key: openssl-3.5.7-${{ runner.os }}-${{ runner.arch }}
      - name: Build OpenSSL 3.5.7 from source (cache miss only)
        if: steps.cache-openssl.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSLO https://github.com/openssl/openssl/releases/download/openssl-3.5.7/openssl-3.5.7.tar.gz
          echo "a8c0d28a529ca480f9f36cf5792e2cd21984552a3c8e4aa11a24aa31aeac98e8  openssl-3.5.7.tar.gz" | sha256sum -c -
          tar xzf openssl-3.5.7.tar.gz
          cd openssl-3.5.7
          ./Configure --prefix="$HOME/openssl-3.5" --libdir=lib no-docs no-tests
          make -s -j"$(nproc)"
          make -s install_sw
      - name: Point C builds at OpenSSL 3.5 (Makefiles honor OPENSSL_PREFIX)
        run: |
          echo "OPENSSL_PREFIX=$HOME/openssl-3.5" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$HOME/openssl-3.5/lib" >> "$GITHUB_ENV"
      - name: Assert OpenSSL >= 3.5 (fail fast — ML-KEM requires 3.5+)
        run: |
          set -euo pipefail
          "$HOME/openssl-3.5/bin/openssl" version
          v="$("$HOME/openssl-3.5/bin/openssl" version | awk '{print $2}')"
          case "$v" in
            3.[5-9]*|3.[1-9][0-9]*|[4-9].*) echo "OpenSSL $v OK (>= 3.5)" ;;
            *) echo "::error::OpenSSL $v < 3.5 — no ML-KEM provider; C seal leg would fail all positive decrypts"; exit 1 ;;
          esac

      - name: TesseraSeal alpha conformance (Python + C + Go + Rust)
        run: TESSERA_CONFORMANCE_SKIP="cpp typescript java cpython" bash tools/conformance/run.sh

      - name: Full cross-language conformance (all 8 ports)
        run: bash tools/conformance/run.sh
        continue-on-error: true

  # All four whitepapers, mirroring latex.yml (TP-012): umbrella + one per
  # project. Built fresh so the drafted release never ships a stale PDF.
  whitepapers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - paper: tessera-umbrella
            dir: latex
            pdf: latex/Tessera_Whitepaper.pdf
          - paper: tessera-id
            dir: tessera-id/latex
            pdf: tessera-id/latex/TesseraID_Whitepaper.pdf
          - paper: tessera-hash
            dir: tessera-hash/latex
            pdf: tessera-hash/latex/TesseraHash_Whitepaper.pdf
          - paper: tessera-seal
            dir: tessera-seal/latex
            pdf: tessera-seal/latex/TesseraSeal_Whitepaper.pdf
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended \
            texlive-fonts-extra texlive-bibtex-extra \
            texlive-science biber lmodern
      - name: Build ${{ matrix.paper }} whitepaper
        run: |
          cd ${{ matrix.dir }}
          make
      - name: Upload PDF artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-whitepaper-${{ matrix.paper }}
          path: ${{ matrix.pdf }}

  # Per-language distributables at 1.3.1. Go ships no artifact (modules are
  # consumed from source via the repo-rooted module paths, TESS-00013); the
  # CPython extensions are build-from-checkout only (their setup.py sources
  # reach outside the package dir — see their pyproject.toml notes) and are
  # deliberately not built into sdists/wheels here.
  artifacts:
    needs: conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: "**/package-lock.json"

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "24"

      - name: Build Rust crate packages (cargo package --no-verify)
        run: |
          set -euo pipefail
          mkdir -p dist
          for crate in tessera-id/rust tessera-hash/rust tessera-seal/rust; do
            (cd "$crate" && cargo package --no-verify)
          done
          cp target/package/*.crate dist/

      - name: Build npm tarballs (npm pack)
        run: |
          set -euo pipefail
          mkdir -p dist
          for pkg in tessera-id/typescript tessera-hash/typescript tessera-seal/typescript; do
            (cd "$pkg" && npm ci && npm pack --pack-destination "$GITHUB_WORKSPACE/dist")
          done

      - name: Build Maven jars (mvn -q package -DskipTests)
        run: |
          set -euo pipefail
          mkdir -p dist
          if ! command -v mvn >/dev/null 2>&1; then
            echo "::warning::maven not available on runner; skipping jar artifacts"
            exit 0
          fi
          for proj in tessera-id/java tessera-hash/java tessera-seal/java; do
            (cd "$proj" && mvn -q package -DskipTests)
            cp "$proj"/target/*.jar dist/
          done

      - name: Build Python sdists + wheels (python -m build)
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 -m pip install --upgrade build
          for proj in tessera-id/python tessera-hash/python tessera-seal/python; do
            python3 -m build --outdir dist "$proj"
          done

      - name: Upload distributables
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-dist
          path: dist/

  # The only job with write permission: gathers every artifact, checksums the
  # full set, and creates a DRAFT GitHub release. Publishing the draft stays a
  # manual maintainer action.
  draft-release:
    needs: [conformance, whitepapers, artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Download all release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Checksum everything (SHA256SUMS)
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Create DRAFT GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          {
            echo "Draft release for tag \`${TAG}\` at commit ${GITHUB_SHA}."
            echo
            echo "Artifacts: Rust .crate files, npm tarballs, Maven jars,"
            echo "Python sdists/wheels, all four whitepaper PDFs, and SHA256SUMS"
            echo "covering every asset."
            echo
            echo "Distribution posture: publish-ready, NOT published. No registry"
            echo "publication happens until the name-clearance gate opens"
            echo "(docs/decisions/2026-06-10-name-clearance.md; posture record:"
            echo "docs/decisions/2026-06-10-distribution-posture.md)."
          } > release-notes-body.md
          gh release create "$TAG" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "tessera $TAG" \
            --notes-file release-notes-body.md \
            release-assets/*

      # ------------------------------------------------------------------
      # Registry publishing — DELIBERATELY DISABLED.
      # Gated on docs/decisions/2026-06-10-name-clearance.md (TP-006/TP-085).
      # When the gate opens, uncomment the stanzas below, wire trusted
      # publishing (crates.io trusted publishing, npm provenance, PyPI
      # attestations), and follow the command sequence recorded in
      # docs/decisions/2026-06-10-distribution-posture.md.
      # ------------------------------------------------------------------
      #
      # - name: Publish Rust crates (GATED on docs/decisions/2026-06-10-name-clearance.md)
      #   run: |
      #     set -euo pipefail
      #     for crate in tessera-id/rust tessera-hash/rust tessera-seal/rust; do
      #       (cd "$crate" && cargo publish)
      #     done
      #
      # - name: Publish npm packages (GATED on docs/decisions/2026-06-10-name-clearance.md)
      #   run: |
      #     set -euo pipefail
      #     for pkg in tessera-id/typescript tessera-hash/typescript tessera-seal/typescript; do
      #       (cd "$pkg" && npm publish --access public --provenance)
      #     done
      #
      # - name: Publish Python packages (GATED on docs/decisions/2026-06-10-name-clearance.md)
      #   run: |
      #     set -euo pipefail
      #     python3 -m pip install --upgrade twine
      #     twine upload release-assets/*.tar.gz release-assets/*.whl
      #
      # Maven Central publication is deferred separately (requires central
      # portal onboarding + GPG signing); see the distribution posture record.
