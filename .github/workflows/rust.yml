name: rust

on:
  workflow_dispatch:   # manual only — no auto-build on push/PR (cost control)

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        toolchain: [stable, beta]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # --locked enforces the committed workspace Cargo.lock (TP-104):
      # CI fails instead of silently re-resolving dependencies.
      - name: cargo test (workspace, --locked)
        run: cargo test --workspace --release --locked
      - name: Build and run conformance runner
        run: |
          cargo build --release --locked --bin conformance_runner
          for f in tessera-id/conformance/vectors/*.json tessera-hash/conformance/vectors/*.json; do
            ./target/release/conformance_runner "$f"
          done
      # GNU `timeout` does not exist on macOS runners (exit 127). The harness
      # takes an iteration budget as argv[1], which bounds the runtime portably
      # (TP-009).
      # Honest naming (TP-101): this harness is a seeded random-input replay
      # loop (fixed default seed 20260519; override via TESSERA_ID_FUZZ_SEED),
      # not coverage-guided fuzzing (the Go native fuzz tier is).
      - name: TesseraID randomized regression replay (5M iterations)
        run: |
          cargo build --release --locked --bin fuzz_decode
          ./target/release/fuzz_decode 5000000
      # Coverage is informational — printed, not gated (TP-102). Linux/stable
      # only: one datapoint is enough for a trend line, and cargo-llvm-cov
      # rebuilds the workspace with instrumentation (expensive).
      - name: Coverage (cargo-llvm-cov, informational)
        if: matrix.toolchain == 'stable' && runner.os == 'Linux'
        continue-on-error: true
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --locked
          cargo llvm-cov --workspace --locked --summary-only
