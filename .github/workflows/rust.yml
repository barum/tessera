name: rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        toolchain: [stable, beta]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: cargo test (workspace)
        run: cargo test --workspace --release
      - name: Build and run conformance runner
        run: |
          cargo build --release --bin conformance_runner
          for f in tessera-id/conformance/vectors/*.json tessera-hash/conformance/vectors/*.json; do
            ./target/release/conformance_runner "$f"
          done
      - name: TesseraID fuzz smoke (60s)
        run: |
          cargo build --release --bin fuzz_decode
          timeout 60 ./target/release/fuzz_decode 5000000 || ec=$?
          if [ "${ec:-0}" != "0" ] && [ "${ec:-0}" != "124" ]; then
            exit "$ec"
          fi
