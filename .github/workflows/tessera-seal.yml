name: TesseraSeal

on:
  workflow_dispatch:   # manual only — no auto-build on push/PR (cost control)

permissions:
  contents: read

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: tessera-seal/python/requirements.txt
      - run: pip install -r tessera-seal/python/requirements.txt pytest
      - name: TesseraSeal Python tests
        run: cd tessera-seal/python && python3 -m pytest test_tessera_seal.py -v
      - name: TesseraSeal bench (smoke)
        run: cd tessera-seal/python && python3 bench.py | head -30

  timing-histogram:
    # TSEAL-00048 (TP-150): automated decrypt-path timing regression against the
    # Python reference. Dispatch-only like every job in this workflow. Default
    # profile: warn > 50 ns, hard-fail > 500 ns. The blocking PR gate lives in
    # conformance.yml (--profile ci: hard-fail > 50 µs for shared runners).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tessera-seal/python/requirements.txt
      - run: pip install -r tessera-seal/python/requirements.txt
      - name: Timing-histogram regression (N=20000)
        run: python3 tools/scripts/timing-histogram.py --pairs 20000 --json-out timing-histogram-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: timing-histogram-report
          path: timing-histogram-report.json

  c:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # Ubuntu apt libssl-dev is OpenSSL 3.0.x — no ML-KEM provider, so every
      # positive decrypt fails at EVP_PKEY_CTX_new_from_name("ML-KEM-1024").
      # Build OpenSSL 3.5.7 from source once and cache it (TP-007). macOS uses
      # Homebrew openssl@3 via the Makefile's pkg-config/prefix discovery.
      - name: Cache OpenSSL 3.5 (Ubuntu, TP-007)
        if: runner.os == 'Linux'
        id: cache-openssl
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/openssl-3.5
          key: openssl-3.5.7-${{ runner.os }}-${{ runner.arch }}
      - name: Build OpenSSL 3.5.7 from source (Ubuntu, cache miss only)
        if: runner.os == 'Linux' && steps.cache-openssl.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSLO https://github.com/openssl/openssl/releases/download/openssl-3.5.7/openssl-3.5.7.tar.gz
          echo "a8c0d28a529ca480f9f36cf5792e2cd21984552a3c8e4aa11a24aa31aeac98e8  openssl-3.5.7.tar.gz" | sha256sum -c -
          tar xzf openssl-3.5.7.tar.gz
          cd openssl-3.5.7
          ./Configure --prefix="$HOME/openssl-3.5" --libdir=lib no-docs no-tests
          make -s -j"$(nproc)"
          make -s install_sw
      - name: Point C builds at OpenSSL 3.5 (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          echo "OPENSSL_PREFIX=$HOME/openssl-3.5" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$HOME/openssl-3.5/lib" >> "$GITHUB_ENV"
      - name: Assert OpenSSL >= 3.5 (fail fast — ML-KEM requires 3.5+)
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
            OPENSSL_BIN="$(brew --prefix openssl@3)/bin/openssl"
          else
            OPENSSL_BIN="$HOME/openssl-3.5/bin/openssl"
          fi
          "$OPENSSL_BIN" version
          v="$("$OPENSSL_BIN" version | awk '{print $2}')"
          case "$v" in
            3.[5-9]*|3.[1-9][0-9]*|[4-9].*) echo "OpenSSL $v OK (>= 3.5)" ;;
            *) echo "::error::OpenSSL $v < 3.5 — no ML-KEM provider"; exit 1 ;;
          esac
      - name: Build common/c primitives
        run: cd common/c && make test
      - name: Build and run tessera-seal/c tests
        run: cd tessera-seal/c && make test
      - name: Build and run tessera-seal/cpp tests
        run: cd tessera-seal/cpp && make test

  go:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
          cache-dependency-path: tessera-seal/go/go.sum
      - name: TesseraSeal Go tests
        run: cd tessera-seal/go && go test -count=1 -timeout 120s

  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: TesseraSeal Rust tests
        run: cd tessera-seal/rust && cargo test --release --test integration

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tessera-seal/typescript/package-lock.json
      - name: Install + test
        run: |
          cd tessera-seal/typescript
          npm install
          npx tsc
          node --test dist/test_tessera_seal.js

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "24"
      - name: TesseraSeal Java tests
        run: cd tessera-seal/java && make test

  cpython-ext:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tessera-seal/python/requirements.txt
      # Same OpenSSL 3.5 requirement as the c job: the extension compiles and
      # links ../c/tessera_seal.c (TP-007). setup.py honors OPENSSL_INCLUDE /
      # OPENSSL_LIB; the C Makefile honors OPENSSL_PREFIX.
      - name: Cache OpenSSL 3.5 (Ubuntu, TP-007)
        if: runner.os == 'Linux'
        id: cache-openssl
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/openssl-3.5
          key: openssl-3.5.7-${{ runner.os }}-${{ runner.arch }}
      - name: Build OpenSSL 3.5.7 from source (Ubuntu, cache miss only)
        if: runner.os == 'Linux' && steps.cache-openssl.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSLO https://github.com/openssl/openssl/releases/download/openssl-3.5.7/openssl-3.5.7.tar.gz
          echo "a8c0d28a529ca480f9f36cf5792e2cd21984552a3c8e4aa11a24aa31aeac98e8  openssl-3.5.7.tar.gz" | sha256sum -c -
          tar xzf openssl-3.5.7.tar.gz
          cd openssl-3.5.7
          ./Configure --prefix="$HOME/openssl-3.5" --libdir=lib no-docs no-tests
          make -s -j"$(nproc)"
          make -s install_sw
      - name: Point the extension build at OpenSSL 3.5 (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          {
            echo "OPENSSL_PREFIX=$HOME/openssl-3.5"
            echo "OPENSSL_INCLUDE=$HOME/openssl-3.5/include"
            echo "OPENSSL_LIB=$HOME/openssl-3.5/lib"
            echo "LD_LIBRARY_PATH=$HOME/openssl-3.5/lib"
          } >> "$GITHUB_ENV"
      - name: Assert OpenSSL >= 3.5 (fail fast — ML-KEM requires 3.5+)
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
            OPENSSL_BIN="$(brew --prefix openssl@3)/bin/openssl"
          else
            OPENSSL_BIN="$HOME/openssl-3.5/bin/openssl"
          fi
          "$OPENSSL_BIN" version
          v="$("$OPENSSL_BIN" version | awk '{print $2}')"
          case "$v" in
            3.[5-9]*|3.[1-9][0-9]*|[4-9].*) echo "OpenSSL $v OK (>= 3.5)" ;;
            *) echo "::error::OpenSSL $v < 3.5 — no ML-KEM provider"; exit 1 ;;
          esac
      - run: pip install setuptools
      - name: Build CPython extension
        run: cd tessera-seal/cpython && python3 setup.py build_ext --inplace
      - name: Run extension tests
        run: cd tessera-seal/cpython && python3 test_tessera_seal_ext.py

  latex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install TeX Live
        run: sudo apt-get update && sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-bibtex-extra texlive-latex-recommended lmodern
      - name: Build whitepaper
        run: cd tessera-seal/latex && make
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: TesseraSeal_Whitepaper
          path: tessera-seal/latex/TesseraSeal_Whitepaper.pdf
