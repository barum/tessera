name: typescript

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: PQID TypeScript test
        working-directory: pqid/typescript
        run: |
          npm install
          npm test
      - name: PQHash TypeScript build
        working-directory: pqhash/typescript
        run: |
          npm install
          npm run build
      - name: Build and run conformance runner
        run: |
          cd tools/conformance/typescript
          npm install
          npm run build
          cd ../../..
          for f in pqid/conformance/vectors/*.json pqhash/conformance/vectors/*.json; do
            node tools/conformance/typescript/dist/conformance_runner.js "$f"
          done
      - name: PQID fuzz smoke (60s)
        working-directory: pqid/typescript
        run: |
          timeout 60 node dist/fuzz/fuzz_decode.js 1000000 || ec=$?
          if [ "${ec:-0}" != "0" ] && [ "${ec:-0}" != "124" ]; then
            exit "$ec"
          fi
