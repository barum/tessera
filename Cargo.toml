# Cargo workspace for the Tessera monorepo.
#
# Each project (tessera-id/, tessera-hash/, tessera-seal/) is an independent
# crate; tools/conformance/rust/ is a binary that depends on all three. The
# workspace unifies builds so a single `cargo build` from the root compiles
# everything.
#
# [profile.*] is only honored at the workspace root (cargo warns and ignores
# profiles declared in member crates), so the shared release profile lives
# here (TESS-00014).

[workspace]
resolver = "3"
members = [
    "tessera-id/rust",
    "tessera-seal/rust",
    "tessera-hash/rust",
    "tessera-mark/rust",
    "tools/conformance/rust",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
