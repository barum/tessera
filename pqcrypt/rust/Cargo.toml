[package]
name = "pqcrypt"
version = "0.1.0"
edition = "2024"

# PQCrypt v1 — pure post-quantum encryption envelope (ML-KEM-1024 +
# AES-256-GCM + UtC commitment). See ../latex/main.tex for the normative
# spec and ../python/pqcrypt.py for the readable canonical source.

[dependencies]
ml-kem = "0.3"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
sha3 = "0.10"
hmac = "0.12"
hkdf = "0.12"
rand_core = "0.6"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"

[lib]
name = "pqcrypt"
path = "src/lib.rs"
