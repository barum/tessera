[package]
name = "tessera-hash"
version = "1.3.1"
edition = "2024"
license = "Apache-2.0"
description = "TesseraHash: 73-byte SHAKE-256 content hash format - Rust reference implementation"
repository = "https://github.com/barum/tessera"
readme = "README.md"
keywords = ["hash", "shake-256", "sha3", "content-hash", "post-quantum"]
categories = ["cryptography", "encoding"]
# Publish-ready, not yet published: registry publication is gated on the
# name-clearance decision (docs/decisions/2026-06-10-name-clearance.md).

[dependencies]
base64 = "0.22"
sha3 = "0.10"

[lib]
name = "tessera_hash"
path = "src/lib.rs"
