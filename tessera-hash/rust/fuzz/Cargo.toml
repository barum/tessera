# cargo-fuzz harness for the TesseraHash Rust reference (TESS-00016 / TP-096).
#
# Coverage-guided runs need the nightly toolchain + cargo-fuzz:
#
#   rustup toolchain install nightly
#   cargo install cargo-fuzz
#   cd tessera-hash/rust && cargo +nightly fuzz run fuzz_decode -- -max_total_time=60
#
# The harness body lives in src/lib.rs so it also compiles and runs on
# STABLE as a plain unit test (a 10k-input random smoke):
#
#   cd tessera-hash/rust/fuzz && cargo test --lib
[package]
name = "tessera-hash-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tessera-hash = { path = ".." }

[lib]
name = "tessera_hash_fuzz"
path = "src/lib.rs"

[[bin]]
name = "fuzz_decode"
path = "fuzz_targets/fuzz_decode.rs"
test = false
doc = false
bench = false

# Standalone: deliberately NOT a member of the repo-root workspace, per
# cargo-fuzz convention.
[workspace]
