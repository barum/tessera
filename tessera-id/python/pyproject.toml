# Packaging for the TesseraID Python reference (TID-00022, TP-084/TP-086).
#
# Posture: publish-ready, NOT published. Publication to PyPI is gated on the
# name-clearance decision (docs/decisions/2026-06-10-name-clearance.md).
#
# Modules stay FLAT (no package directory) by deliberate decision: the wire
# reference is a single readable module. The console command is `tessera-id`;
# the from-checkout form `python3 tessera-id/python/cli.py ...` also works.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tessera-id"
version = "1.3.1"
description = "TesseraID — 41-byte sortable post-quantum-era identifier (Standard + HLC variants), Python reference implementation"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [{ name = "Bahram Samani", email = "bsamani@samani.com" }]
keywords = ["identifier", "uuid", "ulid", "sortable", "post-quantum", "hlc", "hybrid-logical-clock"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
# Stdlib-only by design (os.urandom CSPRNG, hashlib-free): no dependencies.
dependencies = []

[project.scripts]
tessera-id = "tessera_id_cli:main"

[project.urls]
Repository = "https://github.com/barum/tessera"

[tool.setuptools]
# Flat modules, not a package (orchestrator-decided contract; no package-dir
# restructure). cli.py is the from-checkout shim and is intentionally not
# installed — the installed CLI module name must be unique across the three
# sibling projects.
py-modules = ["tessera_id", "tessera_id_fast", "tessera_id_cli"]
