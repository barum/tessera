[package]
name = "tessera-id"
version = "0.1.0"
edition = "2024"

[dependencies]
getrandom = "0.3"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

[lib]
name = "tessera_id"
path = "src/lib.rs"

[[bin]]
name = "bench"
path = "benches/bench_bin.rs"

[[bin]]
name = "fuzz_decode"
path = "src/bin/fuzz_decode.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
