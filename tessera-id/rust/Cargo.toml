[package]
name = "tessera-id"
version = "1.3.1"
edition = "2024"
license = "Apache-2.0"
description = "TesseraID: 41-byte sortable identifier (Standard + HLC variants) - Rust reference implementation"
repository = "https://github.com/barum/tessera"
readme = "README.md"
keywords = ["identifier", "uuid", "sortable", "hlc", "post-quantum"]
categories = ["data-structures", "encoding"]
# Publish-ready, not yet published: registry publication is gated on the
# name-clearance decision (docs/decisions/2026-06-10-name-clearance.md).

[dependencies]
getrandom = "0.3"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

[lib]
name = "tessera_id"
path = "src/lib.rs"

[[bin]]
name = "bench"
path = "benches/bench_bin.rs"

[[bin]]
name = "fuzz_decode"
path = "src/bin/fuzz_decode.rs"
