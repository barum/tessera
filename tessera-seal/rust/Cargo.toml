[package]
name = "tessera-seal"
version = "1.3.1"
edition = "2024"
license = "Apache-2.0"
description = "TesseraSeal: post-quantum encryption envelope (ML-KEM-1024 + AES-256-GCM + UtC commit) - Rust reference implementation"
repository = "https://github.com/barum/tessera"
readme = "README.md"
keywords = ["ml-kem", "post-quantum", "encryption", "aead", "envelope"]
categories = ["cryptography"]
# Publish-ready, not yet published: registry publication is gated on the
# name-clearance decision (docs/decisions/2026-06-10-name-clearance.md).

# TesseraSeal v1 — pure post-quantum encryption envelope (ML-KEM-1024 +
# AES-256-GCM + UtC commitment). See ../latex/main.tex for the normative
# spec and ../python/tessera_seal.py for the readable canonical source.

[dependencies]
ml-kem = "0.3"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
# Hybrid suite 0x06 — X25519 KEX combined with ML-KEM-1024 via SHAKE-256.
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }
sha3 = "0.10"
hmac = "0.12"
hkdf = "0.12"
# OS CSPRNG (umbrella security invariant #1). Pinned exactly; same source as
# tessera-id/rust. Routes to getentropy/getrandom(2)/BCryptGenRandom.
getrandom = "=0.3.4"
zeroize = "1"

[dev-dependencies]
# KAT-vector consumption in tests/integration.rs only — not part of the
# library's dependency surface.
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "tessera_seal"
path = "src/lib.rs"

[[bin]]
name = "tessera-seal-bench"
path = "benches/bench_bin.rs"
