[package]
name = "conformance_runner"
version = "1.3.1"
edition = "2024"
license = "Apache-2.0"
description = "Tessera cross-language conformance harness runner (internal tool, never published)"
repository = "https://github.com/barum/tessera"
publish = false

[dependencies]
tessera-id   = { path = "../../../tessera-id/rust" }
tessera-hash = { path = "../../../tessera-hash/rust" }
tessera-seal = { path = "../../../tessera-seal/rust" }
serde   = { version = "1", features = ["derive"] }
serde_json = "1"
hex     = "0.4"
hmac    = "0.12"
sha3    = "0.10"

[[bin]]
name = "conformance_runner"
path = "src/bin/conformance_runner.rs"

[[bin]]
name = "tessera_seal_runner"
path = "src/bin/tessera_seal_runner.rs"
